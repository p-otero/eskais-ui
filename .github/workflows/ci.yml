name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run registry:build
      - run: bun run registry:validate
      - name: Committed registry output is up to date
        run: git diff --exit-code -- public/r registry.json
      - name: Every pinned dependency is at least 7 days old, so consumers with a minimum release age can install it
        run: node tooling/check-dependency-age.mjs --require-network
      - name: No branch is named like a tag, which raw.githubusercontent.com would serve instead of the tag
        run: node tooling/check-ref-names.mjs

  consumer:
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - name: Install every registry item into a clean app (no Bun)
        run: node tooling/consumer-check.mjs "$PACKAGE_MANAGER"
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}

  browser:
    runs-on: ubuntu-latest
    # The dialog matrix (every dialog on every device and viewport model) runs in both the checks and the compiler build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Contrast and axe in Chrome, default and compact themes in light and dark
        timeout-minutes: 40
        run: bun run test:browser:checks
      - name: AgentTaskBoard as one static HTML file, opened from file:// with the network blocked
        timeout-minutes: 5
        run: node tooling/static-board.mjs
      - name: Screenshots for review (not a gate)
        run: node tooling/screenshots.mjs screenshots
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: The showcase built with React Compiler, then the overlay, fast-link, shell and contrast checks on it
        timeout-minutes: 32
        run: bun run test:compiler

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Performance budgets (renders and forced layouts per key press, board layers, gzip per item)
        timeout-minutes: 10
        run: bun run perf:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-ci
          path: tooling/perf/results/ci.json
          if-no-files-found: ignore

  passed:
    if: always()
    needs: [check, registry, consumer, browser, perf]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: test "$RESULTS" = "success success success success success"
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.registry.result }} ${{ needs.consumer.result }} ${{ needs.browser.result }} ${{ needs.perf.result }}
